<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PhD Research Lab</title>
<meta name="description" content="AI research operating system — one chat for the whole research project">
<link rel="icon" type="image/png" href="/img/favicon-32.png">
<link rel="apple-touch-icon" href="/img/apple-touch-icon.png">
<script>try { var t = localStorage.getItem("pl.theme"); if (t === "light" || t === "dark") document.documentElement.dataset.theme = t; } catch (e) {}</script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>
<div id="app">
  <aside id="side" aria-label="Thanh bên">
    <div class="brand">
      <img src="/img/logo-64.png" alt="">
      <div><b>PhD Research Lab</b><small>AI research OS</small></div>
      <span class="grow"></span>
      <button class="icon" id="side-toggle" title="Thu gọn thanh bên" aria-label="Thu gọn thanh bên" data-i="sidebar"></button>
    </div>
    <div class="side-project">
      <button class="proj-btn" id="proj-btn" aria-haspopup="menu">
        <span class="grow"><span class="name ellipsis" id="proj-name">…</span><span class="sub ellipsis" id="proj-sub"></span></span>
        <span data-i="chev"></span>
      </button>
    </div>
    <div class="side-new"><button class="btn" id="new-chat"><span data-i="plus"></span>Cuộc trò chuyện mới</button></div>
    <div class="side-search"><input type="search" id="search" placeholder="Tìm cuộc trò chuyện…" aria-label="Tìm cuộc trò chuyện"></div>
    <nav id="threads" aria-label="Cuộc trò chuyện"></nav>
    <div class="side-nav">
      <button class="nav" data-go="dashboard"><span data-i="gauge"></span>Theo dõi<span class="count" id="pending-count"></span></button>
      <button class="nav" data-go="library"><span data-i="book"></span>Tài liệu</button>
      <button class="nav" data-go="code"><span data-i="code"></span>Thí nghiệm · VS Code</button>
      <button class="nav" data-go="review"><span data-i="review"></span>Phản biện bài báo</button>
      <button class="nav" data-go="settings"><span data-i="gear"></span>Cài đặt</button>
    </div>
  </aside>

  <main id="main">
    <div class="banner" id="offline" hidden><span data-i="alert"></span><span>Mất kết nối tới máy chủ PhD Lab — đang thử kết nối lại…</span></div>
    <header id="top">
      <button class="icon" id="side-open" title="Mở thanh bên" aria-label="Mở thanh bên" data-i="sidebar"></button>
      <span class="title" id="title"></span>
      <span class="crumb" id="crumb"></span>
      <span class="grow"></span>
      <span class="dot" id="live" title="Đồng bộ với CLI"></span>
      <button class="icon" id="panel-btn" title="Bảng kết quả" aria-label="Bảng kết quả" data-i="panel"></button>
    </header>
    <div id="view"></div>
  </main>

  <aside id="panel" hidden aria-label="Chi tiết">
    <div class="panel-h">
      <span class="ttl" id="panel-title"></span>
      <span id="panel-actions" class="row"></span>
      <button class="icon" id="panel-close" title="Đóng" aria-label="Đóng" data-i="x"></button>
    </div>
    <div class="panel-b" id="panel-body"></div>
  </aside>
</div>
<div id="modal" hidden></div>
<div id="toast" role="status" aria-live="polite"></div>
<script src="/vendor/marked.min.js"></script>
<script src="/vendor/purify.min.js"></script>
<script src="/assets/core.js"></script>
<script src="/assets/chat.js"></script>
<script src="/assets/panels.js"></script>
<script src="/assets/dashboard.js"></script>
<script src="/assets/review.js"></script>
<script src="/assets/settings.js"></script>
<script src="/assets/main.js"></script>
</body>
</html>
