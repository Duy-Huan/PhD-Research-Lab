version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule: {interval: weekly}
  - package-ecosystem: npm
    directory: /frontend
    target-branch: dev
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: pip
    directory: /
    target-branch: dev
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
