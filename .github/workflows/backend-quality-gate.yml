name: Backend Production Quality Gate

on:
  push:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'tools/**'
      - '.github/workflows/backend-quality-gate.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'backend/**'
      - 'tests/**'
      - 'tools/**'

jobs:
  offline-quality-gate:
    name: Safe Offline Quality Gate (${{ matrix.os }} - Py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt || pip install fastapi uvicorn httpx pydantic sqlite3-api coverage
          pip install coverage

      - name: Execute Backend Quality Gate (Smoke Profile)
        env:
          PHDLAB_QA_OFFLINE: "1"
          PYTHONIOENCODING: "utf-8"
        run: |
          python tools/backend_quality_gate.py --profile smoke

      - name: Upload Quality Gate Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-qa-artifacts-${{ matrix.os }}-py${{ matrix.python-version }}
          path: artifacts/backend-qa/
          retention-days: 14
