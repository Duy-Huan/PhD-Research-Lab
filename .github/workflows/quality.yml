name: Quality Gates

on:
  push:
    branches: [dev]
  pull_request:
    branches: [qa, main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PYTHONIOENCODING: utf-8
  PYTHONFAULTHANDLER: '1'
  PHDLAB_QA_OFFLINE: '1'
  NO_PROXY: localhost,127.0.0.1,::1
  # Binaries are shared within this job; each test still owns its private profile/cache.
  # Isolating XDG_CACHE_HOME must not change the install/runtime binary lookup.
  PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/output/playwright/browser-binaries

jobs:
  policy:
    name: Contract and workflow policy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24'}
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python scripts/quality_gate.py policy
      - name: Discover every software regression suite without executing model calls
        run: python scripts/discover_tests.py --out output/playwright/ci/test-inventory.json
      - name: Require actual current-source complete local verification before promotion
        run: python scripts/check_local_verification.py
      - run: python scripts/check_workflows.py
      - name: Critical recovery accounting regressions (no live AI calls)
        run: python -m devtools.verification.unittest_worker output/playwright/ci/critical-recovery.json test_ci_recovery test_baseline_accounting test_ci_repair_supervisor test_ci_workflow_contract
      - run: python tools/qa_harness.py audit --out output/playwright/ci/integrity.json
      - run: python tools/qa_harness.py generate --seed 20261024 --count 100 --out output/playwright/ci/generated-graphs.json
      - name: Preserve skills and agent files throughout the commit range
        env:
          DIFF_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python tools/protect_agent_resources.py --base "$DIFF_BASE"
      - run: node --test .github/scripts/automerge.test.cjs .github/scripts/release_provenance.test.cjs .github/scripts/publish_release.test.cjs

  backend:
    name: Backend (${{ matrix.os }}, Python ${{ matrix.python }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m pip check
      - run: python -m compileall -q backend devtools scripts tools tests
      - name: Complete software regression; informational production coverage
        # Bounded below the 40m job limit so the always() artifact upload below still preserves
        # current-test progress and stall stacks if a run hangs (6.5.13 Windows 3.12 timeout left no evidence).
        # The runner's own backend stage budget (30m) is below this step limit so it reports first.
        # 6.6.3: Windows 3.11 hit the former 25m stage budget at case 1287/1313 with no stuck test; all bounds +5m.
        timeout-minutes: 33
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        # Outer watchdog (31m): console heartbeats, then stops the owned tree so the upload below always runs
        # (Windows 3.12 push runs were killed at the 35m job limit with no log or artifact; 6.6.1).
        run: python -m devtools.verification.ci_watchdog --deadline-s 1860 --out output/playwright/ci/backend -- python scripts/verify.py --profile pr --component backend --base "$env:VERIFY_BASE" --out output/playwright/ci/backend
        shell: pwsh
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: backend-${{ matrix.os }}-${{ matrix.python }}
          path: output/playwright/ci/backend/
          retention-days: 14

  frontend:
    name: Frontend types, whole-source coverage and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm audit --audit-level=high
        working-directory: frontend
      - name: Frontend mandatory gate
        env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python scripts/verify.py --profile pr --component frontend --base "$VERIFY_BASE" --out output/playwright/ci/frontend
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: frontend
          path: |
            output/playwright/ci/frontend/
            frontend/coverage/
          retention-days: 14

  security:
    name: Dependency and high-confidence security checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: python -m pip_audit -r requirements-ci.lock --strict --progress-spinner off
      - run: python -m bandit -r backend devtools scripts -lll -iii

  browser:
    name: Real offline browser smoke
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {fetch-depth: 0, persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: python -m pip install --require-hashes -r requirements-ci.lock
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npx --no-install playwright install --with-deps chromium
        working-directory: frontend
      - env:
          VERIFY_BASE: ${{ github.event.pull_request.base.sha || github.event.before || github.sha }}
        run: python -m devtools.verification.browser --profile pr --offline-all --base "$VERIFY_BASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: browser
          path: |
            output/playwright/ci/browser/
            output/playwright/browser-lease-selftest/
            output/playwright/capability-selftest/
          retention-days: 14

  # v6.6.2 owner policy: every candidate builds its .exe/.deb from the exact checkout and proves
  # install -> start -> health -> uninstall (data kept), so a release never ships stale installers.
  installers:
    name: Installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    defaults:
      run: {shell: bash}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with: {python-version: '3.12'}
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with: {node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json}
      - run: npm ci
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - name: Package the exact checkout
        run: python scripts/package_release.py --sha "$(git rev-parse HEAD)" --out output/release/assets
      - name: Build and smoke-test the Windows installer
        if: runner.os == 'Windows'
        run: |
          command -v ISCC || test -f "/c/Program Files (x86)/Inno Setup 6/ISCC.exe" || choco install innosetup --no-progress -y
          python scripts/build_installers.py windows --assets output/release/assets --out output/release/installers
          python scripts/build_installers.py smoke-windows --installer output/release/installers/*.exe --version "$(python -c "import json;print(json.load(open('output/release/assets/manifest.json'))['version'])")"
      - name: Build and smoke-test the Linux package
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update -qq
          python scripts/build_installers.py deb --assets output/release/assets --out output/release/installers
          python scripts/build_installers.py smoke-deb --deb output/release/installers/*.deb --version "$(python -c "import json;print(json.load(open('output/release/assets/manifest.json'))['version'])")"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: installers-${{ matrix.os }}
          path: output/release/installers/
          retention-days: 7

  development-gate:
    name: Development gate
    if: always()
    needs: [policy, backend, frontend, security, browser, installers]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - env:
          NEEDS_JSON: ${{ toJSON(needs) }}
        run: python scripts/quality_gate.py aggregate --phase development

  # Owner2026-10-26: all forward promotions require complete software regression.
  # Live-provider/AI-UAT qualification is separately dispatched, never called PASS here.
  qa-gate:
    # Never satisfy a protected PR context with the skipped dev-push phase.
    name: ${{ github.event_name == 'pull_request' && 'QA gate' || 'QA not requested on dev push' }}
    if: always() && (github.base_ref == 'qa' || github.base_ref == 'main' || github.ref == 'refs/heads/qa')
    needs: [development-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with: {persist-credentials: false}
      - env: {NEEDS_JSON: '${{ toJSON(needs) }}'}
        run: python scripts/quality_gate.py aggregate --phase qa
